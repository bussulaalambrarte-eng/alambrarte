<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F5C8C">
<title>Plan Alambrarte</title>
<style>
:root{color-scheme:light;--bg:#f4f3ef;--panel:#ffffff;--fg:#1f1e1b;--muted:#5f5c56;--line:#e3e0d8;--brand:#0F5C8C;--brand2:#e8f1f8;
--ok:#0a7d0a;--okbg:#e6f4e6;--bad:#c62f2f;--badbg:#fbeaea;--warn:#8a5a00;--webg:#efe9dc;--warnbg:#fff4d6;--info:#1f5fae;--infobg:#e9f0fb;--r:12px}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#141413;--panel:#1d1d1b;--fg:#f0efec;--muted:#b4b2aa;--line:#33322f;--brand:#5aa2d6;--brand2:#1d2a36;
--ok:#4cc54c;--okbg:#14281a;--bad:#ef6b6b;--badbg:#2d1717;--warn:#f1bd4f;--webg:#26231d;--warnbg:#2c2410;--info:#7fb0f0;--infobg:#17233a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141413;--panel:#1d1d1b;--fg:#f0efec;--muted:#b4b2aa;--line:#33322f;--brand:#5aa2d6;--brand2:#1d2a36;--ok:#4cc54c;--okbg:#14281a;--bad:#ef6b6b;--badbg:#2d1717;--warn:#f1bd4f;--webg:#26231d;--warnbg:#2c2410;--info:#7fb0f0;--infobg:#17233a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:none;margin:0 auto;padding:0 12px 92px}
details.legd{font-size:12px;color:var(--muted);margin:2px 0}details.legd summary{cursor:pointer}details.legd .leg{margin:4px 0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 6px}.btn.sm{padding:6px 12px;font-size:13px}.bar .tog{margin:0 0 0 4px}
.pp .mk{font-size:10px;font-weight:700}.pp .mk.stk{color:var(--info)}.pp .mk.over{color:var(--warn)}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px 10px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}.brand>div{min-width:0}
.brand img{height:30px;background:#fff;border-radius:6px;padding:2px 6px}
.brand b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.on{color:var(--ok);border-color:var(--ok)}.pill.off{color:var(--bad);border-color:var(--bad)}
.lang button{border:1px solid var(--line);background:var(--panel);padding:3px 8px;font-size:12px;cursor:pointer}
.lang button:first-child{border-radius:999px 0 0 999px}.lang button:last-child{border-radius:0 999px 999px 0;margin-left:-1px}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{display:flex;width:100%;max-width:640px}
nav.bottom button{flex:1;border:0;background:none;padding:9px 4px 10px;font-size:12px;color:var(--muted);cursor:pointer;position:relative}
nav.bottom button .ic{display:block;font-size:19px;line-height:1.2}
nav.bottom button.on{color:var(--brand);font-weight:600}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;min-width:16px;line-height:16px}
h2{font-size:18px;margin:14px 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip small{display:block;font-size:10px;color:var(--muted);text-align:center}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}.chip.on small{color:#e7eef5}
.chip.has::after{content:"•";color:var(--brand);margin-left:3px}.chip.on.has::after{color:#fff}
.tot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:10px}
.tot div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.tot b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.tot span{font-size:11px;color:var(--muted)}
.grp{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 2px 6px}
.mrow{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:8px}
.mrow b{font-size:15px}.mrow small{color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.f label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.03em}
.f .ro{border:1px dashed var(--line);border-radius:10px;padding:9px 10px;font-size:18px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center;min-height:46px}
.f .ro button{border:0;background:var(--brand2);color:var(--brand);border-radius:8px;padding:3px 7px;font-size:12px;cursor:pointer}
.f input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:18px;background:var(--panel);font-variant-numeric:tabular-nums;min-height:46px}
.f input:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.f input.uns{background:var(--infobg);border-color:var(--info)}
.saldo{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}
.saldo b{color:var(--fg);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid}
.tag.p{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}.tag.a{color:var(--ok);border-color:var(--ok);background:var(--okbg)}.tag.r{color:var(--bad);border-color:var(--bad);background:var(--badbg)}.tag.u{color:var(--info);border-color:var(--info);background:var(--infobg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.no{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.note{background:var(--brand2);border-left:3px solid var(--brand);border-radius:8px;padding:9px 11px;font-size:13px;margin:8px 0 10px}
.note.w{background:var(--warnbg);border-left-color:var(--warn)}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:2px 0 6px}
/* grade no layout da planilha PP */
.ppw{overflow:auto;max-height:calc(100vh - 120px);overscroll-behavior-x:contain;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.pp{border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums}
.pp th,.pp td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px 6px;white-space:nowrap;text-align:right}
.pp thead th{position:sticky;background:var(--brand);color:#fff;font-weight:600;z-index:3}
.pp thead tr:first-child th{top:0}.pp thead tr:nth-child(2) th{top:24px}
.pp .l{text-align:left}.pp .s1,.pp .s2{position:sticky;background:var(--panel);z-index:2}.pp thead .s1,.pp thead .s2{z-index:4;background:var(--brand)}
.pp .s1{left:0;min-width:74px;width:74px;max-width:74px;overflow:hidden;text-overflow:ellipsis}.pp .s2{left:74px;min-width:84px;box-shadow:1px 0 0 var(--line)}.pp td.s1{max-width:74px;overflow:hidden;text-overflow:ellipsis}
.pp tr.pl td{border-top:2px solid var(--line)}
.pp td.lab{color:var(--muted);font-size:11px;text-align:left}
.pp td.we,.pp td.inp.we{background-color:var(--webg)}.pp th.we{background:#4c7591}.leg i.we{background:var(--webg)}
.pp td small{display:block;font-size:10px;font-weight:500;opacity:.85}.pp td.stk{background-color:var(--infobg);color:var(--info);font-weight:700}.pp td.over{background-color:var(--warnbg);color:var(--warn);font-weight:700}
details.avisos{background:var(--panel);border:1px solid var(--warn);border-radius:10px;padding:8px 10px;margin:4px 0 8px;font-size:13px}details.avisos summary{cursor:pointer;font-weight:600}details.avisos .tag{margin-left:4px}
.pp td.vg{color:var(--ok);font-weight:600}.pp td.vb{color:var(--bad);font-weight:600;background-color:var(--badbg)}
.pp tr.var td.lab{font-weight:600;color:var(--fg)}.pp th.tt,.pp td.tt{border-left:2px solid var(--line)}
.pp td.c{cursor:pointer;min-width:44px}.pp td.c:hover{background:var(--brand2)}
.pp td.pend{background:var(--warnbg);color:var(--warn);font-weight:600}
.pp td.uns{background:var(--infobg);color:var(--info);font-style:italic}
.pp td.chg{font-weight:700;color:var(--brand)}
.pp td.neg{color:var(--bad);font-weight:600}
.pp td.inp{padding:2px}.pp td.inp input{width:84px;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:16px;text-align:right;background:var(--panel);font-variant-numeric:tabular-nums}.pp td.inp input.uns{background:var(--infobg);border-color:var(--info)}
.pp tr.sec td{background:var(--bg);font-weight:700;text-align:left;color:var(--muted)}
.pp tfoot td{background:var(--brand2);font-weight:700}.pp tfoot td.s1{max-width:none;width:auto;font-size:11px}.pp tfoot td.s1,.pp tfoot td.s2{background:var(--brand2)}
.pp.wide td.inp input{width:60px;font-size:14px;padding:5px 4px}
.pp sup.nocat{color:var(--warn);font-weight:700;margin-left:2px}
.pp td.today{background-image:linear-gradient(rgba(15,92,140,.07),rgba(15,92,140,.07))}.pp th.today{background:#0a4569}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin:8px 0}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px;border:1px solid var(--line)}
/* modal */
.mod{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.mod .box{background:var(--panel);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
@media (min-width:640px){.mod{align-items:center}.mod .box{border-radius:16px}}
.mod h3{margin:0 0 4px;font-size:17px}
.fld{margin:10px 0}.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel);font-size:16px}
.login{max-width:420px;margin:40px auto}
.login .u{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:8px}
.sol .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sol .ch{font-size:18px;font-variant-numeric:tabular-nums;margin:6px 0}
.sol .meta{font-size:12px;color:var(--muted)}
.qrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
details.cfg{margin-top:14px;font-size:13px;color:var(--muted)}details.cfg summary{cursor:pointer}
@media (max-width:700px){header.top{position:static;padding:6px 0}.brand small{display:none}.brand b{font-size:14px}main h2{font-size:18px;margin:8px 0 4px}main>.sub{font-size:13px}.chips{padding-bottom:4px}.ppw{max-height:calc(100vh - 70px)}}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 8px;background:var(--panel)}.seg button{border:0;background:none;padding:8px 16px;font-size:14px;cursor:pointer;color:var(--muted)}.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.pp.fit th,.pp.fit td{padding:3px 4px;font-size:11px}.pp.fit thead th[rowspan]{white-space:normal;min-width:46px;line-height:1.15}.pp.fit thead tr:first-child th{height:20px;box-sizing:border-box}.pp.fit thead tr:nth-child(2) th{top:20px}
.pp.fit td.inp input{width:46px;font-size:12px;padding:3px 2px}.pp.fit td small{font-size:9px}.pp.fit .s2{min-width:0}.pp.fit td.lab{font-size:10px;padding:3px 4px}.pp.fit th,.pp.fit td{padding:2px 2px;font-size:10.5px}.pp.fit{width:100%}.pp.fit td.c{min-width:0}.pp.fit td.nw,.pp.fit th.nw{min-width:14px}.pp.fit thead th[rowspan]{min-width:0;font-size:10px}.pp.fit td.s1{max-width:68px}.pp.fit .s1{min-width:68px;width:68px}.pp.fit .s2{left:68px}.pp.fit td.inp input{width:100%;min-width:30px;box-sizing:border-box;font-size:11px;padding:3px 1px}
.lockb{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:8px 10px;margin:4px 0 8px;font-size:13px}.lockb.on{border-left-color:var(--ok)}.lockb{border-left-color:var(--info)}.lockb.env{border-left-color:var(--warn)}.lockb .btn{margin-left:6px}
.pp td.inp input.pend{background:var(--warnbg);border-color:var(--warn);color:var(--warn);font-weight:700}
.pp th.today{background:#c25a0b!important;color:#fff}.pp td.today{box-shadow:inset 2px 0 0 #c25a0b,inset -2px 0 0 #c25a0b}
.pp td.nw,.pp th.nw{background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(120,110,90,.12) 4px 6px);min-width:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:6px 0 10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}.kpi b{font-size:26px;font-variant-numeric:tabular-nums}.kpi span{font-weight:600;font-size:13px}.kpi small{color:var(--muted);font-size:12px}.kpi i{font-style:normal;color:var(--muted);font-size:11px;border-top:1px dashed var(--line);padding-top:4px;margin-top:2px}
.kpi.ok b{color:var(--ok)}.kpi.w b{color:var(--warn)}.kpi.bad b{color:var(--bad)}
.card.pn{margin:10px 0}.chs{overflow-x:auto}.chs svg{width:100%;height:auto;display:block}
.chs .cpl{fill:#c3d3e2}.chs .cre{fill:var(--brand)}.chs .crb{fill:var(--bad)}.chs .cwe{fill:var(--webg)}.chs .base{stroke:var(--line)}
.chs .lv{font-size:10px;font-weight:700;text-anchor:middle;fill:var(--fg)}.chs .lp{font-size:9px;text-anchor:middle;fill:var(--muted)}.chs .ax{font-size:9.5px;text-anchor:middle;fill:var(--muted)}
.chs .hoy{stroke:#c25a0b;stroke-dasharray:4 3;stroke-width:1.5}.chs .hoyt{font-size:10px;fill:#c25a0b;font-weight:700}
.chs .lpl{fill:none;stroke:#9fb7cc;stroke-width:3}.chs .lre{fill:none;stroke:var(--brand);stroke-width:2}.chs .dpl{fill:#9fb7cc}.chs .dre{fill:var(--brand)}
.pt{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;width:100%}.pt th,.pt td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.pt th{color:var(--muted);font-weight:600}.pt .l{text-align:left}.pt td.vg{color:var(--ok);font-weight:600}.pt td.vb{color:var(--bad);font-weight:600}.pt td.we,.pt th.we{background:var(--webg)}.pt tr[data-id]{cursor:pointer}.pt tr[data-id]:hover{background:var(--brand2)}.ps{font-size:11px;margin-top:6px}.ps td,.ps th{padding:3px 4px}
.hb{display:grid;grid-template-columns:120px 1fr 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}.hl{font-weight:600}.hr{display:flex;flex-direction:column;gap:2px}.hr em{font-style:normal;font-size:12px}.hbar{height:10px;background:var(--brand2);border-radius:5px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--brand)}.hbar i.ok{background:var(--ok)}.hbar i.w{background:var(--warn)}.hbar i.bad{background:var(--bad)}
.how{font-size:11px;color:var(--muted);margin:6px 0 0}
@media (max-width:700px){.hb{grid-template-columns:1fr}.kpi b{font-size:22px}}
.pp.fit td.inp{padding:0 1px}.pp.fit td.inp input{border:1px solid transparent;border-bottom-color:var(--line);border-radius:2px;padding:2px 1px;font-size:10.5px;background:transparent;min-width:0}.pp.fit td.inp input:focus{border-color:var(--brand);background:var(--panel);outline:none}.pp.fit td.inp input.uns{background:var(--infobg)}.pp.fit td.inp input.pend{background:var(--warnbg)}
.pp input[type=number]::-webkit-inner-spin-button,.pp input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.pp input[type=number]{-moz-appearance:textfield;appearance:textfield}.pp.fit td.inp input{text-align:right}
.seg.sm button{padding:6px 12px;font-size:13px}
.dcards{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dch{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:8px}.dch b{font-size:17px}.dch small{color:var(--muted);font-size:12px;margin-left:auto}
.dcg{display:grid;grid-template-columns:1fr 1.3fr 1fr 1fr;gap:8px;align-items:end}.dcg>div{display:flex;flex-direction:column;gap:2px}.dcg small{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:none}.dcg b{font-size:18px;font-variant-numeric:tabular-nums}.dcg em{font-style:normal;font-size:11px}
.dcg .in input{width:100%;box-sizing:border-box;font-size:22px;padding:8px 8px;border:2px solid var(--brand);border-radius:10px;text-align:right;background:var(--panel);color:var(--fg);font-variant-numeric:tabular-nums}.dcg .in input.uns{background:var(--infobg)}
.dcg .vg b,.dcg .vg em{color:var(--ok)}.dcg .vb b,.dcg .vb em{color:var(--bad)}
.dcg input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.dcg input[type=number]{-moz-appearance:textfield;appearance:textfield}
.pt td.nw,.pt th.nw{background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(120,110,90,.14) 4px 6px)}
.chip.nw{background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(120,110,90,.14) 4px 6px);color:var(--muted)}.chip.hoy{border-color:#c25a0b;font-weight:700}.chip.on.nw{color:#fff}
</style>
</head>
<body>

  // ------------------------------------------------------------ armazenamento local
  let mem = null;
  function load() { try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) { /* sin storage */ } return mem; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { mem = DB; } }
  function norm(p) {
    p = JSON.parse(JSON.stringify(p));
    p.pid = p.pid || 'p' + (p.titulo || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 30);
    const n = p.dias.length;
    p.items.forEach((it) => { ['plan', 'real', 'emb', 'pemb'].forEach((k) => { it[k] = (it[k] || []).slice(0, n); while (it[k].length < n) it[k].push(null); }); it.ret = it.ret || 0; it.prog = it.prog || 0; it.ini = it.ini || 0; });
    p.hist = p.hist || [];
    p.est = p.est || { plan: p.lock && p.lock.plan === false ? 'abierto' : 'aprobado', pemb: p.lock && p.lock.pemb === false ? 'abierto' : 'aprobado' };
    return p;
  }

  function calMes(ALL) {

    if (a.slice(0, 7) === b.slice(0, 7)) { d1 = a.slice(0, 8) + '01'; const z = new Date(+a.slice(0, 4), +a.slice(5, 7), 0); d2 = a.slice(0, 8) + String(z.getDate()).padStart(2, '0'); }
    const out = []; for (let d = d1; d <= d2;) { out.push(d); const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + 1); d = x.toISOString().slice(0, 10); }
    return out;
  }

  // gráfico de barras: planeado (gruesa, clara) × realizado (fina, oscura), con rótulo de cada valor
  function chartDia(D, pl, re, k0, ix) {

      if (re[i] != null) g += `<rect x="${cx - cw * 0.14}" y="${y0 - hr}" width="${cw * 0.28}" height="${hr}" rx="2" class="${re[i] >= pl[i] ? 'cre' : 'crb'}"><title>${fD(d)} · ${t('Realizado')} ${fN(re[i])} · ${t('Planeado')} ${fN(pl[i])}</title></rect>`;
      const yl = y0 - Math.max(hp, hr) - 4;
      if (re[i] != null) g += `<text x="${cx}" y="${yl}" class="lv">${fN(re[i])}</text>`;
      if (pl[i]) g += `<text x="${cx}" y="${yl - (re[i] != null ? 11 : 0)}" class="lp">${fN(pl[i])}</text>`;
      g += `<text x="${cx}" y="${H - bot + 13}" class="ax">${wd(d).slice(0, 2)}</text><text x="${cx}" y="${H - bot + 25}" class="ax">${+d.slice(8)}</text>`;
    });
    if (k0 > 0 && k0 < D.length) { const xt = 10 + k0 * cw; g += `<line x1="${xt}" y1="${top - 30}" x2="${xt}" y2="${H - bot}" class="hoy"/><text x="${xt + 3}" y="${top - 22}" class="hoyt">${t('HOY')}</text>`; }

    let since = 0, timer = null, listo = false, firmaSol = '';
    const copia = (o) => JSON.parse(JSON.stringify(o));
    const snap = (ok, d) => ({ exists: ok, data: () => (ok ? copia(d) : null), metadata: { fromCache: false, hasPendingWrites: false } });
    const docSnap = (p) => (p === 'pp/plan' ? snap(!!C.plan, C.plan) : p.startsWith('reg/') ? snap(!!C.regs[p.slice(4)], C.regs[p.slice(4)]) : snap(false, null));
    const colDocs = (n, w) => (n === 'reg' ? Object.values(C.regs).filter((d) => !w || d[w[0]] === w[1]) : n === 'sol' ? Object.values(C.sols) : n === 'hist' ? Object.values(C.hist) : []).map((d) => ({ id: d.uid || d.pid, data: () => copia(d) }));
    const emitCol = (n) => L.col.filter((x) => !n || x.n === n).forEach((x) => x.f({ docs: colDocs(x.n, x.w) }));
    const addReg = (r) => { const k = r.pid + '~' + r.dia, d = (C.regs[k] = C.regs[k] || { pid: r.pid, dia: r.dia, regs: {} }); d.regs[r.id + '~' + r.tipo] = r; };
    async function pull() {
      if (!DB.pw) return;
      const r = await apiWeb({ a: 'pull', since });
      if (!r || !r.ok) { if (r && r.err === 'clave') { DB.me = null; DB.pw = null; save(); render(); toast(t('Contraseña incorrecta')); } return; }
      const primera = !listo; listo = true;
      if (r.plan) C.plan = r.plan;
      (r.regs || []).forEach(addReg);
      const fs = JSON.stringify(r.sols || []); const cambioSol = fs !== firmaSol; firmaSol = fs; C.sols = {}; (r.sols || []).forEach((s) => { if (s && s.uid) C.sols[s.uid] = s; });
      if (r.hist) { C.hist = {}; r.hist.forEach((x) => { if (x && x.pid) C.hist[x.pid] = x; }); }
      since = r.ts; WEBST.ok = true; WEBST.last = now();
      if (r.plan || primera) (L.doc['pp/plan'] || []).forEach((f) => f(docSnap('pp/plan')));
      if ((r.regs || []).length || primera) emitCol('reg');
      if (cambioSol || primera) emitCol('sol');
      if (r.hist) emitCol('hist');
    }
    async function push(b) {
      const r = await apiWeb(Object.assign({ a: 'push' }, b));
      if (!r || !r.ok) throw r || { code: 'red' };
      if (r.plan === 'rechazado') { toast(t('El plan está aprobado: el cambio no se guardó.')); DB.dirty = false; }
      if (b.plan || r.plan === 'rechazado') { await pull(); (L.doc['pp/plan'] || []).forEach((f) => f(docSnap('pp/plan'))); }
      return r;
    }
    const ciclo = () => { clearTimeout(timer); timer = setTimeout(async () => { try { if (online()) await pull(); } catch (e) { WEBST.ok = false; } ciclo(); }, 30000); };
    addEventListener('online', () => pull().catch(() => {}));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) pull().catch(() => {}); });
    return {
      start: () => { pull().catch(() => { WEBST.ok = false; LIVE.ready = true; render(); }).finally(ciclo); },
      doc: (p) => ({
        onSnapshot: (f) => { (L.doc[p] = L.doc[p] || []).push(f); if (listo) setTimeout(() => f(docSnap(p)), 0); return () => {}; },
        get: async () => docSnap(p),
        set: async (d) => {
          if (p === 'pp/plan') { C.plan = copia(d); return push({ plan: d }); }
          if (p.startsWith('reg/')) { const rs = Object.values(d.regs || {}); rs.forEach(addReg); return push({ regs: rs }); }
          if (p.startsWith('sol/')) { C.sols[d.uid] = copia(d); return push({ sols: [d] }); }
          if (p.startsWith('hist/')) { C.hist[d.pid] = copia(d); return push({ hist: [d] }); }
          return null;
        },
        update: async (d) => { const rs = Object.values(d.regs || {}); rs.forEach(addReg); return push({ regs: rs }); }
      }),
      collection: (n) => ({
        where: (k, op, v) => ({ onSnapshot: (f) => { L.col.push({ n, w: [k, v], f }); if (listo) setTimeout(() => f({ docs: colDocs(n, [k, v]) }), 0); return () => {}; } }),
        onSnapshot: (f) => { L.col.push({ n, f }); if (listo) setTimeout(() => f({ docs: colDocs(n) }), 0); return () => {}; }
      })
    };
  }
  const WEBST = { ok: false, last: null };
  async function initLive() {
    if (MODE !== 'live') return;
    if (WEB && !DB.pw) return;
    if (LIVE.db) return;
    const [db, user] = WEB ? [webDb(), { isOwner: async () => false, can: async () => true }] : await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    LIVE.user = user;
    LIVE.owner = user ? await user.isOwner() : false;
    if (LIVE.owner && !DB.leftAdmin) { DB.me = 'admin'; DB.tab = null; }
    if (!db) { LIVE.ready = true; render(); toast(t('Sin acceso a los datos compartidos: lo apuntado queda solo en este aparato.')); return; }
    LIVE.db = db;
    const can = user ? await user.can('data.write') : null;
    if (can === false) LIVE.ro = true;
    const timer = setTimeout(() => { LIVE.stale = true; LIVE.ready = true; render(); }, 10000);
    db.doc('pp/config').onSnapshot((s) => { LIVE.pinHash = s.exists ? (s.data() || {}).pin || null : null; }, () => {});
    db.doc('pp/plan').onSnapshot((s) => {
      if (!s.metadata.fromCache) { clearTimeout(timer); LIVE.stale = false; }
      LIVE.ready = true;
      if (s.exists) {
        const d = s.data();
        if (!s.metadata.hasPendingWrites && !DB.dirty) {
          const nuevo = !P() || P().pid !== d.plan.pid;
          DB.plan = norm(d.plan); DB.version = d.version || 1;
          if (nuevo) { DB.dia = null; subscribeRegs(); }
        }
      }
      save(); renderSoft();
    }, () => { LIVE.ready = true; render(); });
    db.collection('sol').onSnapshot((q) => {
      q.docs.forEach((d) => { const s = d.data(); const x = DB.sol.find((y) => y.uid === s.uid); if (x) { if (x.sent !== false || s.status !== 'pend') Object.assign(x, s, { sent: true, sentD: true }); } else DB.sol.unshift(Object.assign({}, s, { sent: true, sentD: true })); });
      DB.sol.sort((a, b) => (a.ts < b.ts ? 1 : -1)); save(); renderSoft();
    }, () => {});
    db.collection('hist').onSnapshot((q) => {
      const xs = q.docs.map((d) => d.data()).filter((a) => a && a.pid && (!P() || a.pid !== P().pid));
      DB.arch = xs.sort((a, b) => (a.cerrado < b.cerrado ? 1 : -1)); save(); if (DB.tab === 'hoja' || DB.tab === 'panel') render();
    }, () => {});
    if (P()) subscribeRegs();
    if (db.start) db.start();
    addEventListener('online', liveFlush);
    setInterval(liveFlush, 30000);
    liveFlush();
  }
  let unReg = null;
  function subscribeRegs() {
    if (!LIVE.db || !P()) return;
    if (unReg) unReg();
    const pid = P().pid;
    unReg = LIVE.db.collection('reg').where('pid', '==', pid).onSnapshot((q) => {
      q.docs.forEach((d) => {
        const body = d.data(), regs = body.regs || {};
        Object.values(regs).forEach((r) => { const k = rk(r.id, r.dia, r.tipo), cur = DB.reg[k]; if (!cur || (cur.sent && cur.ts <= r.ts) || (!cur.sent && cur.ts < r.ts)) DB.reg[k] = Object.assign({}, r, { sent: true }); });
      });
      LIVE.last = now(); save(); renderSoft();
    }, () => {});
  }
  async function liveFlush() {
    if (MODE !== 'live' || !LIVE.db || !online() || LIVE.ro || !P()) return;
    const pend2 = Object.values(DB.reg).filter((r) => !r.sent && r.pid === P().pid);
    const byDia = {};
    pend2.forEach((r) => { (byDia[r.dia] = byDia[r.dia] || []).push(r); });
    for (const [dia, rs] of Object.entries(byDia)) {
      const ref = LIVE.db.doc('reg/' + P().pid + '~' + dia), patch = {};
      rs.forEach((r) => { const c = Object.assign({}, r); delete c.sent; patch[`${r.id}~${r.tipo}`] = c; });
      try { await ref.update({ regs: patch, ts: now() }); }
      catch (e) { try { const s = await ref.get(); await ref.set({ pid: P().pid, dia, ts: now(), regs: Object.assign({}, s.exists ? (s.data().regs || {}) : {}, patch) }); } catch (e2) { if (e2 && e2.code === 'invalid_argument') { LIVE.ro = true; render(); } return; } }
      rs.forEach((r) => { r.sent = true; });
      save(); badges();
    }
    for (const s of DB.sol.filter((x) => !x.sent || (x.status !== 'pend' && !x.sentD))) await liveSol(s);
    LIVE.last = now(); save();
  }
  async function liveSol(s) {
    if (MODE !== 'live' || !LIVE.db || !online() || LIVE.ro) return;
    try { const c = Object.assign({}, s); delete c.sent; delete c.sentD; await LIVE.db.doc('sol/' + s.uid).set(c); s.sent = true; if (s.status !== 'pend') s.sentD = true; save(); badges(); } catch (e) { /* queda pendiente */ }
  }
  let planT = null;
  function livePlanSave(now2) {
    if (MODE !== 'live' || !LIVE.db || LIVE.ro) return;
    clearTimeout(planT);
    planT = setTimeout(async () => {
      if (LIVE.saving) { LIVE.again = true; return; }
      LIVE.saving = true;
      try { DB.version = (DB.version || 1) + (DB.dirty ? 1 : 0); await LIVE.db.doc('pp/plan').set({ plan: P(), version: DB.version, ts: now() }); DB.dirty = false; save(); if (now2) subscribeRegs(); }
      catch (e) { toast(t('Error al enviar; queda guardado para intentar después.')); }
      LIVE.saving = false;
      if (LIVE.again) { LIVE.again = false; livePlanSave(); }
    }, now2 ? 50 : 1200);
  }
  function syncView(m, nR, nE, nS, total) {
    m.appendChild(h(`<h2>${t('Sincronizar')}</h2>`));
    m.appendChild(h(`<p class="note ${LIVE.db && online() ? '' : 'w'}">${t(!LIVE.db ? 'Sin acceso a los datos compartidos: lo apuntado queda solo en este aparato.' : online() ? 'Conectado: lo apuntado sube al instante.' : 'Sin conexión: lo apuntado queda en este celular y sube solo al volver la red.')}</p>`));
    m.appendChild(h(`<div class="card"><b>${t('Pendiente de subir')}</b>
      <div class="qrow"><span>${t('apuntes de realizado')}</span><b>${nR}</b></div><div class="qrow"><span>${t('apuntes de embarque')}</span><b>${nE}</b></div><div class="qrow"><span>${t('solicitudes y decisiones')}</span><b>${nS}</b></div>
      <div class="meta" style="font-size:12px;color:var(--muted);margin-top:6px">${t('Último sincronizado')}: ${LIVE.last ? fTs(LIVE.last) : t('nunca')}</div></div>`));
    if (!total) m.appendChild(h(`<p class="sub">${t('Todo sincronizado.')}</p>`));
    const b = h(`<button class="btn pri" style="width:100%;padding:14px" ${!total || !LIVE.db ? 'disabled' : ''}>⟳ ${t('Sincronizar ahora')} (${total})</button>`);
    b.addEventListener('click', async () => { b.disabled = true; await liveFlush(); render(); }); m.appendChild(b);
    if (isAdmin()) exportBox(m);
    historialEnvios(m);
  }
  function pedirPinAdmin() {
    if (LIVE.owner) { DB.me = 'admin'; DB.leftAdmin = false; DB.tab = null; save(); render(); return; }
    modal(`<h3>${t('Contraseña de ADMIN')}</h3><div class="fld"><input id="pin" type="password" autocapitalize="characters" maxlength="12" autocomplete="off"></div><div class="btns"><button class="btn" data-x>${t('Cancelar')}</button><button class="btn pri" id="go">${t('Entrar')}</button></div>`, (bx, close) => {
      const go = async () => { if ((await sha(bx.querySelector('#pin').value.trim().toUpperCase())) === HASH_ADMIN) { DB.pw = bx.querySelector('#pin').value.trim().toUpperCase(); DB.me = 'admin'; DB.leftAdmin = false; DB.tab = null; save(); close(); render(); } else toast(t('Contraseña incorrecta')); };
      bx.querySelector('#go').addEventListener('click', go); setTimeout(() => bx.querySelector('#pin').focus(), 50);
    });
  }
  function definirPin() {
    modal(`<h3>${t('Definir PIN de ADMIN')}</h3><div class="fld"><input id="pin" type="password" autocapitalize="characters" maxlength="12" autocomplete="off"></div><div class="btns"><button class="btn" data-x>${t('Cancelar')}</button><button class="btn pri" id="go">${t('Guardar')}</button></div>`, (bx, close) => {
      bx.querySelector('#go').addEventListener('click', async () => { const p = bx.querySelector('#pin').value; if (p.length < 4) return; try { await LIVE.db.doc('pp/config').set({ pin: await sha(p), ts: now() }); toast(t('PIN guardado')); close(); } catch (e) { toast(t('Error al enviar; queda guardado para intentar después.')); } });
    });
  }
  // ------------------------------------------------------------ ganchos del APK
  window.ppRecibirTexto = recibirTexto;
  window.ppNativo = () => { render(); };
  window.ppVoltar = () => { const md = document.querySelector('.mod'); if (md) { md.remove(); return true; } const f = tabs()[0][0]; if (DB.tab !== f) { DB.tab = f; save(); render(); return true; } return false; };
  addEventListener('online', render); addEventListener('offline', render);
  // ------------------------------------------------------------ HTML de reporte: carga los datos (del enlace o del archivo consolidado del APK)
  function cargarReporte(o) {
    let plan, reg = {}, arch = [], ts = o.ts || now();
    if (o.tipo === 'pp-consolidado') {
      plan = { titulo: o.titulo, pid: o.pid, dias: o.dias, items: o.items, hist: o.historial || [], est: o.est };
      arch = o.meses_anteriores || [];
    } else {
      plan = (o.plan && o.plan.plan) || o.plan;
      (o.reg || []).forEach((d) => Object.values((d && d.regs) || {}).forEach((r) => { if (r.pid === plan.pid) { const k = rk(r.id, r.dia, r.tipo), c = reg[k]; if (!c || c.ts < r.ts) reg[k] = Object.assign({}, r, { sent: true }); } }));
      arch = (o.hist || []).filter((a) => a && a.pid && a.pid !== plan.pid);
    }
    const f = new Date(ts), p2 = (x) => String(x).padStart(2, '0');
    window.PP_HOY = `${f.getFullYear()}-${p2(f.getMonth() + 1)}-${p2(f.getDate())}`;
    window.PP_TS_TXT = `${f.getDate()}/${MES.es[f.getMonth()]}/${f.getFullYear()} ${p2(f.getHours())}:${p2(f.getMinutes())}`;
    DB.plan = norm(plan); DB.reg = reg; DB.arch = arch; DB.sol = []; DB.me = 'admin'; DB.verMes = null; DB.pnItem = null;
    if (!['panel', 'hoja'].includes(DB.tab)) DB.tab = 'panel';
    render();
  }
  if (MODE === 'live' && WEB && DB.pw) initLive().catch(() => { LIVE.ready = true; render(); });
  // Reporte en vivo servido por el mismo servidor web: pide una de las contraseñas y lee los datos actuales
  function reporteWeb() {
    const pedir = () => modal(`<h3>${t('Reporte Alambrarte')}</h3><div class="fld"><label>${t('Contraseña de ADMIN')}</label><input id="pin" type="password" autocapitalize="characters" maxlength="12" autocomplete="off"></div><div class="btns"><button class="btn pri" id="go">${t('Entrar')}</button></div>`, (bx, close) => {
      const go = () => { DB.pw = bx.querySelector('#pin').value.trim().toUpperCase(); close(); leer(); };
      bx.querySelector('#go').addEventListener('click', go); bx.querySelector('#pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); }); setTimeout(() => bx.querySelector('#pin').focus(), 50);
    });
    const leer = () => apiWeb({ a: 'pull' }).then((r) => {
      if (!r || !r.ok || r.rol !== 'admin') { DB.pw = null; save(); toast(t('Contraseña incorrecta')); return pedir(); }
      save();
      const regs = {}; (r.regs || []).forEach((x) => { regs[x.id + '~' + x.tipo + '~' + x.dia] = x; });
      cargarReporte({ ts: new Date(r.ts).toISOString(), plan: r.plan, reg: [{ regs }], hist: r.hist || [] });
    }).catch(() => { app.innerHTML = '<p class="note w" style="margin:20px">Sin conexión con el servidor.</p>'; });
    if (DB.pw) leer(); else pedir();
  }
  if (REPORTE) {
    if (window.PP_REPORTE_WEB) reporteWeb();
    else if (window.PP_DATA) cargarReporte(window.PP_DATA);
    else fetch('data.json', { cache: 'no-store' }).then((r) => r.json()).then(cargarReporte).catch(() => { app.innerHTML = '<p class="note w" style="margin:20px">No se encontraron los datos del reporte (data.json).</p>'; });
  } else render();
  if (MODE === 'live' && !WEB) initLive().catch(() => { LIVE.ready = true; render(); });
})();
